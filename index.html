<!DOCTYPE html>
<html lang="en">
  <!-- Worldti.me -->
  <!-- Copyright 2020-2026 Max Shinn, available under the GPLv3.0 -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Worldti.me timezone converter - Permalink to the time</title>
    <link rel="stylesheet" href="res-tz/new.css">
    <style>
      .stack { display: grid; gap: 0.85rem; max-width: 42rem; }
      .form-row { display: grid; gap: 0.35rem; }
      [hidden] { display: none !important; }
      .inline-actions { align-items: center; display: flex; flex-wrap: wrap; gap: 0.75rem; }
      .generated-link-box { background: var(--nc-bg-2); border: 1px solid var(--nc-bg-3); border-left: 0.35rem solid var(--nc-ac-1); padding: 0.65rem 0.8rem; }
      .generated-link-label { color: var(--nc-tx-2); font-size: 0.9rem; margin-bottom: 0.2rem; }
      .generated-link { font-family: monospace; overflow-wrap: anywhere; }
      .error { color: #c62828; }
      .result-lines { margin-block: 1.5rem; }
      .primary-result, .secondary-result { overflow: visible; white-space: nowrap; }
      .primary-result { font-size: 2.6rem; font-weight: 700; line-height: 1.15; margin-block: 0 0.45rem; }
      .secondary-result, .zone-note { color: var(--nc-tx-2); }
      .secondary-result { font-size: 1.2rem; line-height: 1.35; margin-block: 0; }
      .timezone-combobox { position: relative; }
      .timezone-options { background: var(--nc-bg-1); border: 1px solid var(--nc-bg-3); left: 0; max-height: 16rem; overflow-y: auto; position: absolute; right: 0; top: calc(100% + 0.25rem); z-index: 10; }
      .timezone-option { cursor: pointer; padding: 0.35rem 0.55rem; }
      .timezone-option[aria-selected="true"], .timezone-option:hover { background: var(--nc-bg-2); }
      fieldset { border: 1px solid var(--nc-bg-3); }
      fieldset label { display: block; margin-block: 0.35rem; }
      table { font-variant-numeric: tabular-nums; }
      .table-filter { margin-block: 1rem 0.5rem; max-width: 24rem; }
      #timetable thead th { background: var(--nc-bg-2); border-bottom: 2px solid var(--nc-bg-3); color: var(--nc-tx-1); }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="https://worldti.me" style="text-decoration: none; color: var(--nc-tx-1)">Worldti.me</a></h1>
      <nav>
        <span style="margin-right: 1em">Permalink to a time and date</span>
        <a href="./">New time</a> /
        <a href="./about">About</a> /
        <a href="https://github.com/mwshinn/worldtime">Source</a>
      </nav>
    </header>

    <main class="container">
      <section id="picker">
        <p>Generate a URL which shows the time in any timezone.</p>
        <form class="stack" id="time-form" action="/" method="get" novalidate>
          <label class="form-row">
            <span>Time</span>
            <input type="time" id="time" step="60" required>
          </label>

          <label class="form-row">
            <span>Date <span class="zone-note">(optional)</span></span>
            <input type="date" id="date" min="1970-01-01" max="9999-12-31">
          </label>

          <div class="form-row timezone-combobox">
            <label for="timezone">Timezone</label>
            <input type="search" id="timezone" placeholder="Search timezone" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="timezone-options">
            <div class="timezone-options" id="timezone-options" role="listbox" hidden></div>
          </div>

          <fieldset id="ambiguity" hidden></fieldset>

          <div class="generated-link-box" id="generatedlinkbox" hidden>
            <div class="generated-link-label">Generated link</div>
            <a class="generated-link" id="generatedlink"></a>
          </div>

          <div class="inline-actions" id="copylinkrow" hidden>
            <button type="button" id="copylinkbutton" disabled>Copy link</button>
            <span class="zone-note" id="copystatus" aria-live="polite"></span>
          </div>

          <div class="error" id="errorgentext" role="alert"></div>
        </form>
      </section>

      <div class="error" hidden id="urlerror" role="alert">Error, invalid link</div>
      <div class="error" id="jserror" role="alert">Please enable javascript</div>

      <section id="displaytime" hidden>
        <div class="result-lines">
          <p class="primary-result" id="localdisplay"></p>
          <p class="secondary-result" id="organizerdisplay"></p>
        </div>

        <p><button type="button" id="showalllink">Time in other locations</button></p>
        <label class="form-row table-filter" id="tablefilterrow" hidden>
          <span>Filter locations</span>
          <input type="search" id="tablefilter" placeholder="Search locations" autocomplete="off">
        </label>
        <table id="timetable" hidden>
          <thead>
            <tr>
              <th>Location</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script src="res-tz/worldtime.js"></script>
    <script>
      // @license magnet:?xt=urn:btih:1f739d935676111cfff4b4693e3816e664797050&dn=gpl-3.0.txt GPL-v3-or-Later
      Worldtime.init();
      // @license-end
    </script>
  </body>
</html>
